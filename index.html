<header><div class="brand"><span class="mark" aria-hidden="true">纸</span><div><h1>纸境</h1><small>剪纸层叠海报工坊</small></div></div><div class="header-actions"><span class="top-note">本地处理 · 无需 API</span><select id="resolution" class="export-options" aria-label="导出尺寸"><option value="1200">1200 × 1600</option><option value="1800" selected>1800 × 2400</option><option value="2400">2400 × 3200</option></select><button id="download" class="primary">下载海报 PNG ↗</button></div></header>
<div class="app"><aside><p class="intro">将一片风景，剪成一叠有温度的纸。</p>
<section class="section"><h2 class="section-title"><span><span class="index">01</span>风景底片</span><button id="demo" class="quiet">使用示例</button></h2><div class="photo-row"><img id="thumb" alt="当前风景底片"><div class="photo-info"><span class="filename" id="filename">山河 · 示例风景</span><button id="upload" class="upload">＋ 上传风景</button></div></div><input id="file" type="file" accept="image/jpeg,image/png"><p class="fine">JPG / PNG · 可拖入预览区 · 照片不会上传</p><details class="fold"><summary>调整 3:4 构图裁切</summary><label class="control"><span class="label-row">横向取景 <output class="value" id="cropXValue"></output></span><input class="range" id="cropX" type="range" min="0" max="100" value="50"></label><label class="control"><span class="label-row">纵向取景 <output class="value" id="cropYValue"></output></span><input class="range" id="cropY" type="range" min="0" max="100" value="50"></label><label class="control"><span class="label-row">取景放大 <output class="value" id="zoomValue"></output></span><input class="range" id="zoom" type="range" min="100" max="200" value="100"></label><p class="fine">等比例裁切，全出血，不拉伸原图。</p></details></section>
<section class="section"><h2 class="section-title"><span><span class="index">02</span>纸张与层次</span><button id="random" class="quiet">↻ 随机配色</button></h2><div id="palettes" class="palettes"></div><div id="colors" class="custom-colors" aria-label="自定义纸张颜色"></div><label class="control"><span class="label-row">剪纸层数 <output class="value" id="layersValue"></output></span><input class="range" id="layers" type="range" min="4" max="10" value="7"></label><label class="control"><span class="label-row">形状概括 <output class="value" id="simplifyValue"></output></span><input class="range" id="simplify" type="range" min="0" max="100" value="60"></label><label class="control"><span class="label-row">纸层厚度 <output class="value" id="depthValue"></output></span><input class="range" id="depth" type="range" min="0" max="18" value="8"></label><label class="control"><span class="label-row">纸张纤维 <output class="value" id="grainValue"></output></span><input class="range" id="grain" type="range" min="0" max="100" value="45"></label><label class="control"><span class="label-row">窄纸条节奏 <output class="value" id="stripsValue"></output></span><input class="range" id="strips" type="range" min="0" max="100" value="28"></label></section>
<section class="section"><h2 class="section-title"><span><span class="index">03</span>图景点缀</span></h2><label class="control"><span class="label-row">微小尺度物</span><select id="reference"><option value="none">无</option><option value="birds">飞鸟</option><option value="boat">纸舟</option></select></label></section>
<label class="control mobile-resolution" style="margin-bottom:20px"><span class="label-row">PNG 导出尺寸</span><select id="mobileResolution" aria-label="PNG 导出尺寸"><option value="1200">1200 × 1600</option><option value="1800" selected>1800 × 2400</option><option value="2400">2400 × 3200</option></select></label><button id="reset" class="reset">恢复默认参数</button><p class="author">作者：德里克文</p></aside>
<main class="main"><div class="toolbar"><div><h2 class="comparison-title" id="comparisonTitle">原图与纸艺</h2><p class="comparison-subtitle">同一构图 · 实时对比</p></div><div class="preview-meta"><span id="sourceSize">示例风景</span><br>3:4 竖版 · 全出血</div></div><section class="comparison" id="comparison" aria-labelledby="comparisonTitle"><figure class="compare-panel"><figcaption class="panel-heading"><strong>原图</strong><span>当前裁切</span></figcaption><div class="stage" id="originalStage"><canvas id="originalPreview" width="900" height="1200" role="img" aria-label="原图预览，与纸艺效果使用相同的 3:4 裁切"></canvas></div></figure><figure class="compare-panel"><figcaption class="panel-heading"><strong>纸艺效果</strong><span id="layerLabel">7 层彩纸</span></figcaption><div class="stage" id="stage" aria-busy="true"><canvas id="preview" width="900" height="1200" role="img" aria-label="剪纸海报实时预览"></canvas><span class="processing" id="processing">正在准备纸艺效果…</span></div></figure></section><div class="caption"><span><strong>等比例裁切</strong> · 两幅画面同步取景</span><span id="status" role="status" aria-live="polite" aria-atomic="true">正在准备</span></div><p class="bottom">照片轮廓化为剪纸，留下风景的层次与肌理。<br>纯浏览器风格化实验 · 上传、调整、导出均在你的设备完成</p></main></div><div id="toast" class="toast" role="status" hidden></div>

<script id="workerCode" type="text/plain">
self.onmessage=({data:{pixels,w,h,layers,simplify,id}})=>{
 const n=w*h, a=new Float32Array(n), hist=new Uint32Array(256);for(let i=0;i<n;i++)a[i]=.2126*pixels[i*4]+.7152*pixels[i*4+1]+.0722*pixels[i*4+2];
 const r=Math.round(1+simplify/12), temp=new Float32Array(n), smooth=new Float32Array(n);
 for(let y=0;y<h;y++){let sum=0;for(let x=-r;x<=r;x++)sum+=a[y*w+Math.max(0,x)];for(let x=0;x<w;x++){temp[y*w+x]=sum/(2*r+1);sum+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)];}}
 for(let x=0;x<w;x++){let sum=0;for(let y=-r;y<=r;y++)sum+=temp[Math.max(0,y)*w+x];for(let y=0;y<h;y++){smooth[y*w+x]=sum/(2*r+1);sum+=temp[Math.min(h-1,y+r+1)*w+x]-temp[Math.max(0,y-r)*w+x];}}
 for(let i=0;i<n;i++)hist[Math.max(0,Math.min(255,Math.round(smooth[i]))) ]++;
 let lo=0,hi=255,c=0;for(let i=0;i<256;i++){c+=hist[i];if(c>=n*.02){lo=i;break;}}c=0;for(let i=255;i>=0;i--){c+=hist[i];if(c>=n*.02){hi=i;break;}}const span=Math.max(1,hi-lo);
 const levels=new Uint8Array(n);for(let i=0;i<n;i++)levels[i]=Math.min(layers-1,Math.floor((1-Math.pow(Math.max(0,Math.min(1,(smooth[i]-lo)/span)),.7))*layers));
 function simplifyPath(p,eps){if(p.length<12)return p;const out=[p[0]],last=p[p.length-1];function rec(s,e){const v=p[s],z=p[e],dx=z[0]-v[0],dy=z[1]-v[1],len=dx*dx+dy*dy;let max=eps*eps,at=-1;for(let j=s+1;j<e;j++){const t=len?Math.max(0,Math.min(1,((p[j][0]-v[0])*dx+(p[j][1]-v[1])*dy)/len)):0;const dd=(p[j][0]-v[0]-t*dx)**2+(p[j][1]-v[1]-t*dy)**2;if(dd>max){max=dd;at=j;}}if(at!==-1){rec(s,at);out.push(p[at]);rec(at,e);}}rec(0,p.length-1);out.push(last);return out;}
 const result=[];for(let k=1;k<layers;k++){
  const edges=new Map(),stride=w+1;const add=(a,b)=>{let arr=edges.get(a);if(arr)arr.push(b);else edges.set(a,[b]);};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(levels[i]<k)continue;const q=y*stride+x;if(!y||levels[i-w]<k)add(q,q+1);if(x===w-1||levels[i+1]<k)add(q+1,q+1+stride);if(y===h-1||levels[i+w]<k)add(q+stride+1,q+stride);if(!x||levels[i-1]<k)add(q+stride,q);}
  const contours=[];while(edges.size){const start=edges.keys().next().value;let cur=start,p=[],guard=0;do{p.push([cur%stride,Math.floor(cur/stride)]);let arr=edges.get(cur);if(!arr)break;cur=arr.pop();if(!arr.length)edges.delete(p[p.length-1][1]*stride+p[p.length-1][0]);if(++guard>n*4)break;}while(cur!==start);if(p.length<12)continue;let area=0;for(let j=0;j<p.length;j++){const v=p[j],z=p[(j+1)%p.length];area+=v[0]*z[1]-z[0]*v[1];}if(Math.abs(area)<12+simplify*.8)continue;p.push(p[0]);contours.push(simplifyPath(p,.35+simplify/90));}
  result.push(contours);
 }
 self.postMessage({id,result,w,h});
};

function showPalettes(){const box=$('palettes');box.replaceChildren();palettes.forEach((p,i)=>{const b=document.createElement('button');b.className='palette'+(activePalette===i?' active':'');b.setAttribute('aria-pressed',activePalette===i);b.textContent=p.name;const sw=document.createElement('span');sw.className='swatches';p.colors.forEach(c=>{const s=document.createElement('i');s.style.background=c;sw.append(s)});b.append(sw);b.onclick=()=>{activePalette=i;state.colors=[...p.colors];showPalettes();showColors();queueRender()};box.append(b)});}
function showColors(){const box=$('colors');box.replaceChildren();state.colors.forEach((c,i)=>{const input=document.createElement('input');input.type='color';input.value=c;input.setAttribute('aria-label','第 '+(i+1)+' 张纸的颜色');input.oninput=()=>{state.colors[i]=input.value;activePalette=-1;showPalettes();queueRender()};box.append(input)});}
function cropRect(){const iw=currentImage.naturalWidth,ih=currentImage.naturalHeight;let sw=iw,sh=iw*4/3;if(sh>ih){sh=ih;sw=ih*3/4;}sw/=state.zoom/100;sh/=state.zoom/100;return[(iw-sw)*state.cropX/100,(ih-sh)*state.cropY/100,sw,sh];}
function drawPhoto(c,w,h){c.fillStyle='#eee7d3';c.fillRect(0,0,w,h);const r=cropRect();c.drawImage(currentImage,...r,0,0,w,h);}
// Every requested crop or image invalidates older worker results immediately.
function updateDownload(){ $('download').disabled=exporting||loadingImage||!currentImage||!!processingError; }
function setBusy(busy,message='正在裁切纸层…'){$('stage').setAttribute('aria-busy',String(busy));$('processing').hidden=!busy;$('processing').textContent=message;}
function queueSegment(){clearTimeout(timer);timer=null;job++;processingError=null;setBusy(true,loadingImage?'正在读取照片…':'正在裁切纸层…');$('status').textContent=loadingImage?'正在读取照片':'正在同步纸艺效果';render();updateDownload();if(currentImage&&!loadingImage)timer=setTimeout(()=>{timer=null;segment();},90);}
function segment(){if(!currentImage||loadingImage)return;const a=analysis.getContext('2d',{willReadFrequently:true});drawPhoto(a,360,480);const pixels=a.getImageData(0,0,360,480).data;worker.postMessage({pixels,w:360,h:480,layers:state.layers,simplify:state.simplify,id:job},[pixels.buffer]);}
function createPath(cs,w,h){const path=new Path2D();for(const p of cs){if(p.length<3)continue;const z=p[p.length-2],first=p[0];path.moveTo((z[0]+first[0])/2/w,(z[1]+first[1])/2/h);for(let i=0;i<p.length-1;i++){const a=p[i],b=p[(i+1)%(p.length-1)],mx=(a[0]+b[0])/2/w,my=(a[1]+b[1])/2/h;if(a[0]===0||a[0]===w||a[1]===0||a[1]===h){path.lineTo(a[0]/w,a[1]/h);path.lineTo(mx,my);}else path.quadraticCurveTo(a[0]/w,a[1]/h,mx,my);}path.closePath();}return path;}
worker.onmessage=({data})=>{if(data.id!==job||loadingImage)return;contours=data;paths=data.result.map(p=>createPath(p,data.w,data.h));readyJob=data.id;processingError=null;setBusy(false);$('status').textContent='两幅画面已同步';render();updateDownload();waiters.splice(0).forEach(({resolve})=>resolve());};
worker.onerror=()=>{processingError=Error('纸层处理失败');setBusy(true,'纸层处理失败，请刷新后重试');$('status').textContent='纸层处理失败';updateDownload();toast('纸层处理失败，请刷新后重试');waiters.splice(0).forEach(({reject})=>reject(processingError));};
function queueRender(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render);}
function rgb(h){return h.match(/[0-9a-f]{2}/gi).map(x=>parseInt(x,16));}function paperColor(index,total){const at=index/(total-1)*(state.colors.length-1),lo=Math.floor(at),hi=Math.ceil(at),t=at-lo,a=rgb(state.colors[lo]),b=rgb(state.colors[hi]);return 'rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*t)).join(',')+')';}
function texture(w,h){const key=w+'x'+h;if(textureCache.has(key))return textureCache.get(key);const c=document.createElement('canvas');c.width=w;c.height=h;const t=c.getContext('2d'),d=t.createImageData(w,h);let seed=1234567;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}for(let i=0;i<d.data.length;i+=4){const n=112+Math.floor(rand()*32);d.data[i]=d.data[i+1]=d.data[i+2]=n;d.data[i+3]=255;}t.putImageData(d,0,0);for(let i=0;i<w*h/180;i++){const x=rand()*w,y=rand()*h;t.strokeStyle=rand()>.5?'rgba(255,255,255,.17)':'rgba(30,25,15,.1)';t.lineWidth=.45;t.beginPath();t.moveTo(x,y);t.lineTo(x+rand()*5+1,y+rand()*2-1);t.stroke();}if(textureCache.size>2)textureCache.clear();textureCache.set(key,c);return c;}
function drawReference(c,w,h){if(state.reference==='none')return;c.save();c.translate(w*.37,h*.7);c.scale(w/900,w/900);c.strokeStyle=state.colors[state.colors.length-1];c.fillStyle=state.colors[state.colors.length-1];c.lineWidth=2;if(state.reference==='birds'){for(let i=0;i<3;i++){c.beginPath();c.moveTo(i*25,10+i*6);c.quadraticCurveTo(i*25+7,i*6,i*25+13,10+i*6);c.quadraticCurveTo(i*25+18,i*6,i*25+25,10+i*6);c.stroke();}}else{c.beginPath();c.moveTo(0,15);c.lineTo(45,15);c.lineTo(32,25);c.lineTo(12,25);c.closePath();c.fill();c.beginPath();c.moveTo(24,12);c.lineTo(24,-20);c.lineTo(43,12);c.closePath();c.fill();}c.restore();}
function drawEffect(c,w,h){if(!contours)return;c.clearRect(0,0,w,h);c.fillStyle=paperColor(0,state.layers);c.fillRect(0,0,w,h);const scale=w/900;paths.forEach((p,i)=>{c.save();c.scale(w,h);c.fillStyle=paperColor(i+1,paths.length+1);c.shadowColor='#1b2b2266';c.shadowOffsetX=state.depth*.15*scale;c.shadowOffsetY=state.depth*scale;c.shadowBlur=state.depth*.6*scale;c.fill(p,'evenodd');c.shadowColor='transparent';c.lineWidth=.55/w;c.strokeStyle='#fff7df4a';c.stroke(p);c.restore();if(state.strips>0){c.save();c.scale(w,h);c.clip(p,'evenodd');c.lineWidth=(1+state.strips/50)/w;c.strokeStyle='#faf0d333';const count=Math.round(state.strips/15);for(let s=1;s<=count;s++){c.save();c.translate(0,s*(2.2+state.depth*.1)/1200);c.stroke(p);c.restore();}c.restore();}});if(state.grain>0){c.save();c.globalCompositeOperation='soft-light';c.globalAlpha=state.grain/100*.8;c.drawImage(texture(w,h),0,0);c.restore();}drawReference(c,w,h);}
function render(){if(!currentImage)return;drawPhoto(originalCtx,originalCanvas.width,originalCanvas.height);if(!loadingImage&&readyJob===job&&contours)drawEffect(ctx,canvas.width,canvas.height);}
// Decode only the latest image request; stale loads never replace either panel.
function loadImage(src,name,{cropX=50,objectURL=false}={}){
 const request=++imageRequest;loadingImage=true;queueSegment();
 const task=(async()=>{const img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src;});if(request!==imageRequest){if(objectURL)URL.revokeObjectURL(src);return false;}
 const previousURL=imageURL;currentImage=img;imageURL=objectURL?src:null;$('thumb').src=src;$('filename').textContent=name;$('sourceSize').textContent=img.naturalWidth+' × '+img.naturalHeight;state.cropX=cropX;state.cropY=50;state.zoom=100;loadingImage=false;sync();queueSegment();if(previousURL)URL.revokeObjectURL(previousURL);return true;
 }catch(error){if(objectURL)URL.revokeObjectURL(src);if(request!==imageRequest)return false;loadingImage=false;if(currentImage)queueSegment();else{setBusy(true,'请选择一张 JPG 或 PNG 照片');$('status').textContent='照片读取失败';updateDownload();}throw error;}})();imageReady=task;return task;
}
async function demo(){try{await loadImage('data:image/jpeg;base64,'+$('sample').textContent.trim(),'山河 · 示例风景',{cropX:20});}catch{toast('示例加载失败');}}
async function upload(file){if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)){toast('请选择 JPG 或 PNG 图片');return;}try{if(await loadImage(URL.createObjectURL(file),file.name,{objectURL:true}))toast('照片已在本地载入');}catch{toast('无法读取图片，请换一张 JPG 或 PNG');}}
async function awaitReady(){while(true){if(loadingImage){try{await imageReady;}catch{}continue;}if(!currentImage)throw Error('没有可导出的照片');if(processingError)throw processingError;if(timer){clearTimeout(timer);timer=null;segment();}if(readyJob===job&&contours)return;await new Promise((resolve,reject)=>waiters.push({resolve,reject}));}}
async function download(){if(!currentImage||exporting||loadingImage)return;exporting=true;updateDownload();$('download').textContent='正在制作 PNG…';try{await awaitReady();if(!contours)throw Error();const out=document.createElement('canvas');out.width=Number(state.resolution);out.height=out.width*4/3;drawEffect(out.getContext('2d'),out.width,out.height);const blob=await new Promise(r=>out.toBlob(r,'image/png'));if(!blob)throw Error();const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='纸境-剪纸风景-' +out.width+'x'+out.height+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PNG 已导出 · '+out.width+' × '+out.height);}catch{toast('导出失败，请重试');}finally{exporting=false;updateDownload();$('download').textContent='下载海报 PNG ↗';}}
function reset(){state={...defaults,colors:[...palettes[0].colors]};activePalette=0;sync();showPalettes();showColors();queueSegment();toast('已恢复默认参数');}
for(const k of Object.keys(defaults)){$(k).addEventListener($(k).type==='range'||$(k).type==='color'?'input':'change',()=>{state[k]=typeof defaults[k]==='number'?Number($(k).value):$(k).value;sync();if(['layers','simplify','cropX','cropY','zoom'].includes(k))queueSegment();else queueRender();});}
$('mobileResolution').onchange=()=>{state.resolution=Number($('mobileResolution').value);sync();};$('upload').onclick=()=>$('file').click();$('file').onchange=()=>{upload($('file').files[0]);$('file').value='';};$('demo').onclick=demo;$('download').onclick=download;$('reset').onclick=reset;$('random').onclick=()=>{let i;do{i=Math.floor(Math.random()*palettes.length);}while(i===activePalette);activePalette=i;state.colors=[...palettes[i].colors];showPalettes();showColors();queueRender();};
for(const ev of ['dragenter','dragover'])$('comparison').addEventListener(ev,e=>{e.preventDefault();$('comparison').classList.add('drag');});$('comparison').addEventListener('dragleave',e=>{if(!$('comparison').contains(e.relatedTarget))$('comparison').classList.remove('drag');});$('comparison').addEventListener('drop',e=>{e.preventDefault();$('comparison').classList.remove('drag');upload(e.dataTransfer.files[0]);});
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const schema={palette:{type:'integer',minimum:0,maximum:3},layers:{type:'integer',minimum:4,maximum:10},simplify:{type:'number',minimum:0,maximum:100},depth:{type:'number',minimum:0,maximum:18},grain:{type:'number',minimum:0,maximum:100},strips:{type:'number',minimum:0,maximum:100}};try{Promise.resolve(document.modelContext.registerTool({name:'adjust_paper_poster',title:'调整剪纸海报',description:'批量调整纸境海报参数并等待预览更新。图片在浏览器本地处理。',annotations:{readOnlyHint:false,untrustedContentHint:false},inputSchema:{type:'object',properties:schema,additionalProperties:false},execute:async args=>{if(!args||typeof args!=='object'||Array.isArray(args))throw Error('参数必须为对象');for(const [k,v] of Object.entries(args)){const s=schema[k];if(!s)throw Error('未知参数：'+k);if(s.type==='string'){if(typeof v!=='string'||(s.maxLength&&Array.from(v).length>s.maxLength)||(s.enum&&!s.enum.includes(v)))throw Error('无效参数：'+k);}else if(typeof v!=='number'||!Number.isFinite(v)||v<s.minimum||v>s.maximum||(s.type==='integer'&&!Number.isInteger(v)))throw Error('无效参数：'+k);}let segmentNeeded=false;for(const [key,v] of Object.entries(args)){if(key==='palette'){activePalette=v;state.colors=[...palettes[v].colors];showPalettes();showColors();}else{state[key]=v;segmentNeeded||=['layers','simplify'].includes(key);}}sync();if(segmentNeeded){queueSegment();await awaitReady();}else render();return{layers:state.layers,status:'预览已更新'};}},{signal:lifecycle.signal})).catch(()=>{});addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}catch{}}
sync();showPalettes();showColors();demo();
</script></body></html>
